<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipe Juru Dapur: pembinaan harian tenaga dapur MBG.">
<title>Juru Dapur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: bilah atas berisi empat meja kerja (HP pekerja, papan kepala dapur, bursa tenaga, pemeriksa kartu); setiap meja dibangun dari token sage di bawah */
:root {
  --bg: #F2F5F0;
  --surface: #FFFFFF;
  --surface-2: #E8EFE7;
  --ink: #1D2921;
  --muted: #5A695F;
  --line: #D2DCD2;
  --accent: #4E6E58;
  --accent-strong: #2F4636;
  --accent-mid: #7A9A82;
  --accent-soft: #DCE7DD;
  --on-accent: #FFFFFF;
  --warn: #8F5D0E;
  --warn-bg: #FBEED3;
  --warn-line: #E6BF73;
  --bad: #A13E32;
  --bad-bg: #F8E1DC;
  --bezel: #1B211D;
  --screen: #F7F9F6;
  --shadow: 0 1px 2px rgba(29, 41, 33, .06), 0 10px 28px rgba(29, 41, 33, .09);
  --f-display: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif;
  --f-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #18201B; --surface-2: #212B24; --ink: #E3EBE4; --muted: #9BAAA0; --line: #2E3A31;
    --accent: #8DB39A; --accent-strong: #B9D4C1; --accent-mid: #6C927A; --accent-soft: #233429; --on-accent: #0E1510;
    --warn: #EBB85E; --warn-bg: #362B15; --warn-line: #6B5422; --bad: #EF9C90; --bad-bg: #3B201C;
    --bezel: #050806; --screen: #141B16; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #18201B; --surface-2: #212B24; --ink: #E3EBE4; --muted: #9BAAA0; --line: #2E3A31;
  --accent: #8DB39A; --accent-strong: #B9D4C1; --accent-mid: #6C927A; --accent-soft: #233429; --on-accent: #0E1510;
  --warn: #EBB85E; --warn-bg: #362B15; --warn-line: #6B5422; --bad: #EF9C90; --bad-bg: #3B201C;
  --bezel: #050806; --screen: #141B16; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-mid); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* bilah atas */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(140deg, var(--accent-strong), var(--accent-mid)); display: grid; place-items: center; color: var(--on-accent); }
.brand b { font-family: var(--f-display); font-size: 19px; letter-spacing: -.02em; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.tabs button:hover { color: var(--ink); }
.proto-tag { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--accent-mid); color: var(--accent); white-space: nowrap; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.view-head h1 { font-size: clamp(24px, 3.2vw, 32px); }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.panel h3 { font-size: 17px; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent-mid); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--accent-soft); color: var(--accent-strong); }
.p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); }
.p-idle { background: var(--surface-2); color: var(--muted); }

/* ===== meja pekerja ===== */
.worker-grid { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 28px; align-items: start; }
.guide { display: grid; gap: 16px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.steps li.done::before { content: "✓"; background: var(--accent); color: var(--on-accent); }
.steps b { display: block; font-size: 14.5px; }
.steps span { color: var(--muted); font-size: 13.5px; }
.persona-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.persona { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; text-align: left; display: grid; gap: 2px; }
.persona[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.persona b { font-size: 14px; }
.persona span { font-size: 12px; color: var(--muted); }
.logic { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.logic li { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; }
.logic .k { flex: none; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }

.phone { width: 390px; max-width: 100%; height: 800px; background: var(--bezel); border-radius: 46px; padding: 12px; box-shadow: var(--shadow); position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.screen { width: 100%; height: 100%; background: var(--screen); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.statusbar { display: flex; justify-content: space-between; padding: 12px 26px 6px; font-size: 12.5px; font-weight: 700; flex: none; }
.notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 92px; height: 24px; background: var(--bezel); border-radius: 14px; }
.sc { flex: 1; overflow-y: auto; padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.navbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 8px 14px; }
.navbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 6px; border-radius: 10px; }
.navbar button[aria-current="true"] { color: var(--accent-strong); }
.navbar svg { width: 22px; height: 22px; }

.hello h2 { font-size: 24px; }
.hello p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); }
.big-cta { border: 0; border-radius: 22px; padding: 18px; text-align: left; background: linear-gradient(140deg, var(--accent-strong), var(--accent) 60%, var(--accent-mid)); color: var(--on-accent); display: grid; gap: 4px; box-shadow: 0 8px 20px rgba(47, 70, 54, .25); }
.big-cta b { font-family: var(--f-display); font-size: 22px; line-height: 1.15; }
.big-cta span { font-size: 13px; opacity: .9; }
.big-cta .go { justify-self: end; margin-top: 6px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.card h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.done-card { border-radius: 22px; padding: 16px; display: grid; gap: 6px; }
.done-card.ok { background: var(--accent-soft); color: var(--accent-strong); }
.done-card.warn { background: var(--warn-bg); color: var(--warn); }
.done-card b { font-family: var(--f-display); font-size: 20px; }
.done-card span { font-size: 13px; color: var(--ink); }
.menu-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.menu-list li { display: flex; gap: 8px; align-items: center; }
.menu-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-mid); }
.streak-dots { display: flex; gap: 5px; margin-top: 8px; }
.streak-dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--accent); }
.streak-dots i.off { background: var(--surface-2); }
.row-link { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.row-link .ico { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 800; font-family: var(--f-display); }
.row-link .ico.warn { background: var(--warn-bg); color: var(--warn); }
.row-link b { display: block; font-size: 14.5px; line-height: 1.3; }
.row-link small { color: var(--muted); font-size: 12.5px; }
.row-link .chev { margin-left: auto; color: var(--muted); }

.q-top { display: flex; align-items: center; gap: 10px; }
.q-top .x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; flex: none; }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.why-chip { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); padding: 4px 10px; border-radius: 999px; }
.illus { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; display: grid; place-items: center; padding: 10px; }
.illus svg { width: 100%; max-width: 280px; height: 150px; }
.q-text { font-family: var(--f-display); font-size: 21px; line-height: 1.25; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; text-align: left; font-weight: 600; font-size: 15.5px; min-height: 58px; }
.opt:hover { border-color: var(--accent-mid); }
.opt.right { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
.feedback.ok { background: var(--accent-soft); }
.feedback.no { background: var(--bad-bg); }
.feedback b { font-family: var(--f-display); font-size: 18px; }
.feedback.ok b { color: var(--accent-strong); }
.feedback.no b { color: var(--bad); }
.feedback p { margin: 0; font-size: 14px; }
.full { width: 100%; justify-content: center; padding: 14px; font-size: 15.5px; border-radius: 14px; }

.player { background: #0E1310; border-radius: 20px; overflow: hidden; color: #E9F0EA; }
.player .stage { aspect-ratio: 16 / 11; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at 30% 20%, #2C4334, #0E1310 70%); position: relative; }
.player .stage svg { width: 70%; height: auto; }
.player .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 10px; font-size: 13.5px; line-height: 1.35; }
.player .ctl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 12.5px; }
.player .track { flex: 1; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
.player .track i { display: block; height: 100%; width: 0; background: #A9C2AE; }

.result-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.result-list li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; }
.result-list .mk { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.mk.y { background: var(--accent); color: var(--on-accent); }
.mk.n { background: var(--warn-bg); color: var(--warn); }

.mod-prog { display: flex; align-items: baseline; gap: 8px; }
.mod-prog b { font-family: var(--f-display); font-size: 30px; }
.mod-list { display: grid; gap: 8px; }
.slide { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
.slide .n { font-family: var(--f-display); font-size: 44px; font-weight: 800; color: var(--accent-mid); line-height: 1; }
.slide p { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 4px; }

.idcard { border-radius: 22px; padding: 16px; color: #fff; background: linear-gradient(150deg, #2F4636, #4E6E58 55%, #7A9A82); display: grid; gap: 12px; box-shadow: 0 10px 24px rgba(47, 70, 54, .3); position: relative; overflow: hidden; }
.idcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.07); }
.idcard .hd { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.idcard .who { display: flex; gap: 12px; align-items: center; }
.avatar { width: 54px; height: 54px; border-radius: 14px; background: #DCE7DD; color: #2F4636; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; flex: none; }
.idcard .who b { font-family: var(--f-display); font-size: 20px; display: block; line-height: 1.2; }
.idcard .who span { font-size: 13px; opacity: .9; }
.idcard .ft { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.qr { background: #fff; padding: 8px; border-radius: 12px; line-height: 0; flex: none; }
.qr svg { width: 104px; height: 104px; display: block; }
.mods-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.mods-grid span { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--muted); }
.mods-grid span.on { background: var(--accent); color: var(--on-accent); }
.mods-grid span.due { background: var(--warn-bg); color: var(--warn); outline: 1.5px solid var(--warn-line); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.prac { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.prac li { display: flex; gap: 8px; }
.prac li::before { content: "✓"; color: var(--accent); font-weight: 800; }
.prac small { color: var(--muted); display: block; font-size: 12px; }

.login { justify-content: center; text-align: center; gap: 18px; }
.login .logo { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto; background: linear-gradient(140deg, var(--accent-strong), var(--accent-mid)); display: grid; place-items: center; color: var(--on-accent); }
.login h2 { font-size: 28px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; margin: 0 auto; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.scanbox { border: 2px dashed var(--accent-mid); border-radius: 22px; padding: 18px; display: grid; gap: 8px; justify-items: center; background: var(--surface); }
.scanbox .frame { width: 120px; height: 120px; border-radius: 16px; position: relative; display: grid; place-items: center; color: var(--accent); }
.scanbox .frame::after { content: ""; position: absolute; left: 8px; right: 8px; height: 3px; background: var(--accent); top: 10px; border-radius: 2px; opacity: 0; }
.scanning .frame::after { opacity: 1; animation: scan 1s ease-in-out infinite alternate; }
@keyframes scan { to { top: 106px; } }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.field { display: grid; gap: 6px; text-align: left; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field input, .field select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; width: 100%; }

/* ===== papan kesiapan ===== */
.kpis { display: grid; grid-template-columns: 1.3fr repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi.hero { background: linear-gradient(140deg, var(--accent-strong), var(--accent) 70%); color: var(--on-accent); border: 0; }
.kpi.hero .v { font-size: 52px; }
.kpi.hero .l { color: var(--on-accent); opacity: .85; }
.kpi .meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 6px; position: relative; }
.kpi .meter i { display: block; height: 100%; background: var(--on-accent); }
.kpi .meter em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--on-accent); opacity: .6; }
.kpi.warn .v { color: var(--warn); }
.board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.board > .stack { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.stack { display: grid; gap: 14px; min-width: 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

      '<div class="field"><label for="fr">Peran</label><select id="fr" data-a="brole"><option value="semua">Semua peran</option>' + ['Tim persiapan', 'Juru masak', 'Pemorsi', 'Pencucian', 'Distribusi'].map(function (k) { return '<option ' + (b.role === k ? 'selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
      '<button class="fchip" style="padding:10px 14px" data-a="bfull" aria-pressed="' + b.full + '">Hanya yang lulus 12 modul</button></div>';
    var cards = '<div class="cands">' + (list.length ? list.map(function (c) {
      var foot;
      if (b.sent[c.id]) foot = '<div class="sent">' + IC.check + 'Permintaan terkirim. Tim Juru Dapur menghubungi kepala dapur dalam 1 x 24 jam.</div>';
      else if (b.confirm === c.id) foot = '<div class="confirm"><span>Ajukan <b>' + esc(c.name) + '</b> untuk SPPG Contoh 01? Biaya rujukan ' + rp(300000) + ' dibayar dapur. Hubungan kerja langsung antara pekerja dan pengelola SPPG.</span><div class="btns"><button class="btn btn-primary btn-sm" data-a="bsend" data-v="' + c.id + '">Kirim permintaan</button><button class="btn btn-sm" data-a="bcancel">Batal</button></div></div>';
      else foot = '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-a="bask" data-v="' + c.id + '">Ajukan penempatan</button><button class="btn btn-sm" data-a="bverify" data-v="' + c.id + '">Lihat Kartu</button></div>';
      return '<article class="cand"><div class="top-row"><div class="avatar">' + initials(c.name) + '</div><div><b>' + esc(c.name) + '</b><span class="loc">Kec. ' + c.kec + ' · <span class="mono">' + c.id + '</span></span></div></div>' +
        '<div class="tags">' + c.roles.map(function (r) { return '<span class="tag">' + esc(r) + '</span>'; }).join('') + '</div>' +
        '<div style="font-size:13px;color:var(--muted)">' + esc(c.src) + '</div>' +
        '<div class="stat-line"><span>Modul <b class="num">' + c.mods + '/12</b></span><span>Praktik <b class="num">' + c.prac + '</b></span><span class="pill p-ok" style="font-size:11.5px">' + esc(c.avail) + '</span></div>' + foot + '</article>';
    }).join('') : '<div class="empty">Belum ada tenaga terlatih dengan kriteria ini. Coba ubah kecamatan atau peran.</div>') + '</div>';
    return '<main class="wrap">' + head + filters + cards + foot() + '</main>';
  }

  // ===== verifikasi kartu =====
  function viewVerify() {
    var id = S.verifyId, r = rosterById(id), bk = bankById(id), w = S.workers[id];
    var res;
    if (!r && !bk) {
      res = '<div class="panel empty">Kartu dengan nomor <span class="mono">' + esc(id) + '</span> tidak ditemukan. Periksa lagi nomor di bawah QR, formatnya JD-MLG-0000.</div>';
    } else {
      var name = (r || bk).name, role = r ? r.role : bk.roles.join(', ');
      var mods = w ? w.mods : null, modsN = w ? w.mods.length : (r ? r.modsN : bk.mods);
      if (!mods) { mods = []; for (var i = 1; i <= modsN; i++) mods.push(i); }
      var due = w ? w.due : [];
      var prac = w ? DEMO[id].prac : [['Cuci tangan enam langkah', '2 Okt 2026'], ['Memisahkan alat mentah dan matang', '2 Okt 2026'], ['Mencuci dan menyanitasi ompreng', '9 Okt 2026']].slice(0, bk ? Math.min(3, bk.prac) : 2);
      var comp = r ? Math.round(r.att / 16 * 100) : 94;
      comp = Math.min(comp, 100);
      res = '<div class="vres"><div class="panel"><div class="vhead"><div class="avatar" style="background:var(--accent-soft);color:var(--accent-strong)">' + initials(name) + '</div><div><span class="pill p-ok">Kartu aktif dan terverifikasi</span><h2 style="margin-top:6px">' + esc(name) + '</h2><div style="color:var(--muted)">' + esc(role) + ' · <span class="mono">' + id + '</span></div></div></div></div>' +
        '<div class="vgrid"><div class="kpi"><span class="v">' + modsN + '/12</span><span class="l">Modul lulus</span></div><div class="kpi"><span class="v">' + prac.length + '</span><span class="l">Praktik diverifikasi pendamping</span></div><div class="kpi"><span class="v">' + comp + '%</span><span class="l">Kepatuhan Cek Siap Shift 30 hari</span></div></div>' +
        '<div class="panel"><h3>Modul</h3><p class="sub">Arahkan kursor ke nomor untuk melihat judul modul.</p><div class="mods-grid" style="max-width:420px">' + MODULES.map(function (m) {
          return '<span class="' + (due.indexOf(m.n) > -1 ? 'due' : mods.indexOf(m.n) > -1 ? 'on' : '') + '" title="' + esc(m.t) + '">' + m.n + '</span>';
        }).join('') + '</div></div>' +
        '<div class="panel"><h3>Praktik terverifikasi</h3><ul class="prac" style="margin-top:8px">' + prac.map(function (p) { return '<li><span>' + esc(p[0]) + '<small>' + esc(p[1]) + ' · diverifikasi pendamping lapangan Juru Dapur</small></span></li>'; }).join('') + '</ul></div>' +
        '<p class="honest">Kartu Kompetensi adalah catatan pembinaan internal Juru Dapur. Kartu ini melengkapi, tidak menggantikan, sertifikat pelatihan keamanan pangan resmi dan SLHS.</p></div>';
    }
    var quick = ['JD-MLG-0142', 'JD-MLG-0157', 'JD-MLG-0311', 'JD-MLG-0340'];
    var left = '<div class="stack"><div class="panel"><h3>Periksa Kartu Kompetensi</h3><p class="sub">Kepala dapur memindai QR di kartu calon pekerja, atau mengetik nomor kartunya.</p>' +
      '<form data-f="verify" style="display:grid;gap:10px"><div class="field"><label for="vid">Nomor kartu</label><input id="vid" class="mono" value="' + esc(id) + '" autocomplete="off"></div><button class="btn btn-primary" type="submit" style="justify-content:center">Periksa kartu</button></form>' +
      '<div class="quick"><span style="font-size:12.5px;color:var(--muted);width:100%">Contoh nomor:</span>' + quick.map(function (q) { return '<button class="fchip mono" data-a="vquick" data-v="' + q + '">' + q + '</button>'; }).join('') + '</div></div>' +
      ((r || bk) ? cardBlock(id) : '') + '</div>';
    return '<main class="wrap"><div class="view-head"><div><h1>Verifikasi Kartu</h1><p>Pekerja yang pindah dapur membawa kartunya. Pengelola dapur baru tidak perlu melatih dari nol.</p></div></div><div class="verify">' + left + res + '</div>' + foot() + '</main>';
  }

  function foot() { return '<p class="foot">Prototipe Juru Dapur untuk Bright Impact Business Challenge 2026. Semua nama, nomor, dan angka adalah contoh fiktif.</p>'; }

  // ---------- interaksi ----------
  var toastTimer = null;
  function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = ''; render(); }, 2600); }
  function setTab(t) {
    stopVideo();
    S.tab = t;
    try { history.replaceState(null, '', '#' + t); } catch (e) {}
    window.scrollTo(0, 0); render();
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
    if (el.tagName === 'SELECT') return;
    if (a === 'closerekap-bg' && e.target !== el) return;
    switch (a) {
      case 'tab': setTab(v); return;
      case 'persona': stopVideo(); S.persona = v; S.loggedIn = false; S.scanning = false; S.screen = 'home'; S.check = null; break;
      case 'lang': S.lang = v; break;
      case 'scan': S.scanning = true; render(); setTimeout(function () { S.scanning = false; S.loggedIn = true; S.screen = 'home'; render(); }, 1300); return;
      case 'login': S.loggedIn = true; S.screen = 'home'; break;
      case 'scr': stopVideo(); S.screen = v; S.modOpen = null; if (v === 'card') S.cardSeen = true; break;
      case 'startcheck': startCheck(); break;
      case 'quitcheck': S.screen = 'home'; S.check = null; break;
      case 'answer':
        var c = S.check, q = Q[c.plan[c.i][0]];
        c.picked = +v;
        if (+v !== q.ok && c.wrong.indexOf(c.plan[c.i][0]) < 0) c.wrong.push(c.plan[c.i][0]);
        break;
      case 'next':
        if (S.check.i < 2) { S.check.i++; S.check.picked = null; S.check.retry = false; }
        else finishCheck();
        break;
      case 'video': S.screen = 'video'; render(); runVideo(); return;
      case 'skipvideo':
        stopVideo();
        tick(60, MODULES[Q[S.check.plan[S.check.i][0]].mod - 1]); return;
      case 'retry': stopVideo(); S.check.picked = null; S.check.retry = true; S.screen = 'check'; break;
      case 'gotoboard': S.flashId = S.persona; S.filter = 'semua'; setTab('papan'); if (S.flashId) render(); return;
      case 'openmod': S.modOpen = +v; S.slide = 0; S.quizPick = null; S.screen = 'module'; break;
      case 'slide': S.slide++; break;
      case 'quiz':
        S.quizPick = +v;
        var m = MODULES[S.modOpen - 1], key = null;
        Object.keys(Q).forEach(function (k) { if (!key && Q[k].mod === m.n) key = k; });
        var okIdx = key ? Q[key].ok : 0;
        if (+v === okIdx) {
          var w = S.workers[S.persona];
          if (w.mods.indexOf(m.n) < 0) w.mods.push(m.n);
          w.due = w.due.filter(function (x) { return x !== m.n; });
          me().modsN = w.mods.length;
        }
        break;
      case 'modagain': S.slide = 0; S.quizPick = null; break;
      case 'showcard': S.verifyId = S.persona; setTab('kartu'); return;
      case 'filter': S.filter = v; break;
      case 'coached': var rw = rosterById(v); rw.status = 'didampingi'; S.flashId = v; toast('Ditandai sudah didampingi: ' + rw.name); return;
      case 'remind': toast('Pengingat WhatsApp terkirim ke ' + rosterById(v).name + ' (simulasi)'); return;
      case 'rekap': S.rekap = true; break;
      case 'closerekap': case 'closerekap-bg': S.rekap = false; break;
      case 'bfull': S.bank.full = !S.bank.full; break;
      case 'bask': S.bank.confirm = v; break;
      case 'bcancel': S.bank.confirm = null; break;
      case 'bsend': S.bank.sent[v] = true; S.bank.confirm = null; break;
      case 'bverify': S.verifyId = v; setTab('kartu'); return;
      case 'vquick': S.verifyId = v; break;
      default: return;
    }
    render();
  });
  app.addEventListener('change', function (e) {
    var a = e.target.getAttribute('data-a');
    if (a === 'bkec') { S.bank.kec = e.target.value; render(); }
    if (a === 'brole') { S.bank.role = e.target.value; render(); }
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.getAttribute('data-f') === 'verify') { S.verifyId = document.getElementById('vid').value.trim().toUpperCase(); render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.rekap) { S.rekap = false; render(); } });

  var h0 = (location.hash || '').replace('#', '');
  if (['pekerja', 'papan', 'bank', 'kartu'].indexOf(h0) > -1) S.tab = h0;
  render();
})();
</script>

</body>
</html>
